---
name: Release CrouzetTheme

'on':
  push:
    tags:
      - '[0-9]*'

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.12.0'

      - name: Validate and build
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          import { VERSION } from './scripts/build.ts';
          const { version } = JSON.parse(readFileSync('manifest.json', 'utf8'));
          assert.match(version, VERSION);
          assert.equal(version, process.env.RELEASE_TAG, 'Le tag doit correspondre au manifeste');
          JS
          yamllint -d relaxed .github/workflows/release.yml
          shellcheck release.sh
          npm run build
          npm test

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            theme.css
            manifest.json

      - name: Publish theme
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" theme.css manifest.json \
            --verify-tag --title "$RELEASE_TAG" --notes "Release $RELEASE_TAG"
